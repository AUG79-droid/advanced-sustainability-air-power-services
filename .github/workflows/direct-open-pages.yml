name: Direct Open - GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build static course for GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npx next build
          test -f out/index.html
          python - <<'PY'
          from pathlib import Path
          prefix = "/advanced-sustainability-air-power-services"
          leftovers = []
          for path in Path("out").rglob("*"):
              if not path.is_file() or path.suffix.lower() not in {".html", ".js", ".css", ".txt", ".json"}:
                  continue
              text = path.read_text(encoding="utf-8", errors="ignore")
              updated = text.replace('"/course/', f'"{prefix}/course/')
              updated = updated.replace("'/course/", f"'{prefix}/course/")
              updated = updated.replace('"/favicon.svg', f'"{prefix}/favicon.svg')
              updated = updated.replace("'/favicon.svg", f"'{prefix}/favicon.svg")
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
              if '"/course/' in updated or "'/course/" in updated or '"/favicon.svg' in updated or "'/favicon.svg" in updated:
                  leftovers.append(str(path))
          if leftovers:
              raise SystemExit("Unprefixed local asset paths remain in: " + ", ".join(leftovers))
          PY
          touch out/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
